name: Release extension

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./public/manifest.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag v$tag does not match manifest version $manifest."
            exit 1
          fi

      - name: Check types and comments
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build unpacked extension
        run: npm run build

      - name: Zip dist folder
        run: zip -r dist.zip dist

      - name: Attach dist.zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
